schema_version: 1
component: frontend
cli_constraint: ">=0.1.0 <1.0.0"
payload:
  include:
    - src
    - package.json
    - index.html
    - AGENTS.md
    - LICENSE
transforms:
  - kind: json_string
    path: package.json
    key: name
    value_from: frontend_package_name
  - kind: app_brand
    path: src/config/index.ts
    from: SpringHere
    value_from: project_name
