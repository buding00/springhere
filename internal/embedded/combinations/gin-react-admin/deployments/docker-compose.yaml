services:
  postgres:
    image: postgres:18-alpine
    container_name: __PROJECT_NAME__-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: springhere
      POSTGRES_PASSWORD: springhere
      POSTGRES_DB: springhere
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U springhere -d springhere"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s

  redis:
    image: redis:8-alpine
    container_name: __PROJECT_NAME__-redis
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--bind", "0.0.0.0",
        "--port", "6379",
        "--protected-mode", "no",
        "--appendonly", "yes",
        "--appendfsync", "everysec",
        "--maxmemory-policy", "noeviction",
      ]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-h", "127.0.0.1", "-p", "6379", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

volumes:
  postgres-data:
  redis-data:
